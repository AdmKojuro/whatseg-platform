<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsEg — Configuraci&oacute;n de M&oacute;dulos</title>
  <link rel="icon" type="image/webp" href="/whatseg_favicon.webp">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'IBM Plex Sans',system-ui,sans-serif;min-height:100vh;background:linear-gradient(135deg,#071a0e 0%,#0d2818 40%,#0a1628 100%);color:#fff;overflow-x:hidden}

    .particles{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
    .particle{position:absolute;width:2px;height:2px;background:rgba(34,197,94,.3);border-radius:50%;animation:float linear infinite}
    @keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-20px) scale(1);opacity:0}}
    .grid-bg{position:fixed;inset:0;z-index:0;opacity:.03;background-image:linear-gradient(rgba(34,197,94,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(34,197,94,.5) 1px,transparent 1px);background-size:50px 50px;pointer-events:none}

    .header{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid rgba(255,255,255,.06)}
    .header-left{display:flex;align-items:center;gap:14px}
    .header-left img{height:42px;width:auto;filter:drop-shadow(0 0 16px rgba(34,197,94,.25))}
    .header-left span{font-size:12px;color:#64748b}
    .header-right{display:flex;align-items:center;gap:16px}
    .btn-back{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#94a3b8;padding:8px 16px;border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
    .btn-back:hover{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:#22c55e}

    .main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:32px 32px 60px}
    .page-title{font-size:28px;font-weight:700;margin-bottom:6px;letter-spacing:-.3px}
    .page-title span{color:#22c55e}
    .page-desc{font-size:14px;color:#64748b;margin-bottom:32px}

    /* Community cards */
    .community-list{display:flex;flex-direction:column;gap:16px}
    .community-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:24px;transition:border-color .2s}
    .community-card:hover{border-color:rgba(34,197,94,.15)}
    .community-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .community-name{font-size:18px;font-weight:700;color:#fff}
    .community-code{font-size:11px;color:#64748b;background:rgba(255,255,255,.05);padding:2px 8px;border-radius:6px}

    /* Module toggles */
    .modules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
    .module-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:10px;transition:all .2s}
    .module-item.active{border-color:rgba(34,197,94,.2);background:rgba(34,197,94,.03)}
    .module-info{display:flex;align-items:center;gap:10px}
    .module-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .module-icon.active{background:rgba(34,197,94,.15)}
    .module-icon.inactive{background:rgba(148,163,184,.1)}
    .module-name{font-size:13px;font-weight:600;color:#e2e8f0}
    .module-always{font-size:10px;color:#22c55e;font-weight:600;text-transform:uppercase;letter-spacing:.3px}

    /* Toggle switch */
    .toggle{position:relative;width:44px;height:24px;cursor:pointer;flex-shrink:0}
    .toggle input{opacity:0;width:0;height:0}
    .toggle-slider{position:absolute;inset:0;background:rgba(148,163,184,.2);border-radius:12px;transition:all .3s}
    .toggle-slider::before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#94a3b8;top:3px;left:3px;transition:all .3s}
    .toggle input:checked+.toggle-slider{background:rgba(34,197,94,.4)}
    .toggle input:checked+.toggle-slider::before{background:#22c55e;transform:translateX(20px)}
    .toggle.disabled{pointer-events:none;opacity:.5}

    /* Status toast */
    .toast{position:fixed;bottom:24px;right:24px;background:#22c55e;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:100;opacity:0;transform:translateY(20px);transition:all .3s;pointer-events:none}
    .toast.show{opacity:1;transform:translateY(0)}

    .loading{text-align:center;padding:60px;color:#64748b;font-size:14px}

    @media(max-width:680px){
      .main{padding:20px 16px 40px}
      .page-title{font-size:22px}
      .modules-grid{grid-template-columns:1fr}
      .header{padding:16px 20px}
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="grid-bg"></div>

  <div class="header">
    <div class="header-left">
      <img src="/edison.webp" alt="WhatsEg">
      <span>Configuraci&oacute;n de M&oacute;dulos</span>
    </div>
    <div class="header-right">
      <a href="/modulos" class="btn-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Volver a M&oacute;dulos
      </a>
    </div>
  </div>

  <div class="main">
    <div class="page-title">Configuraci&oacute;n de <span>M&oacute;dulos</span></div>
    <p class="page-desc">Selecciona qu&eacute; m&oacute;dulos est&aacute;n disponibles para cada comunidad. El Dashboard siempre est&aacute; activo.</p>

    <div id="content" class="community-list">
      <div class="loading">Cargando comunidades...</div>
    </div>
  </div>

  <div class="toast" id="toast">Guardado</div>

  <script>
  var MODULOS_META = {
    RONDAS: { nombre: 'Monitoreo de Rondas', icono: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>' },
    BOTON_PANICO: { nombre: 'Bot\u00f3n de P\u00e1nico', icono: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' },
    REPORTES_PTT: { nombre: 'Reportes PTT', icono: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>' },
    ASISTENTE_IA: { nombre: 'PTT con Asistente IA', icono: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="4"/></svg>' },
    SOPORTE_BILINGUE: { nombre: 'Soporte Biling\u00fce', icono: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>' },
    VIDEOPORTERO: { nombre: 'Videoportero', icono: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>' }
  };

  /* ---- Auth ---- */
  var token = localStorage.getItem('trd_token');
  if (!token) window.location.replace('/login');

  var admin = {};
  try { admin = JSON.parse(localStorage.getItem('trd_admin') || '{}'); } catch(e) {}

  if (admin.rol !== 'SUPERADMIN') {
    window.location.replace('/modulos');
  }

  /* ---- API ---- */
  async function api(path, opts) {
    var res = await fetch('/api/ext/modulos' + path, Object.assign({
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
    }, opts || {}));
    if (res.status === 401) { localStorage.removeItem('trd_token'); window.location.replace('/login'); }
    return res.json();
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg || 'Guardado';
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
  }

  /* ---- Render ---- */
  async function cargar() {
    var data = await api('/comunidades-config');
    var container = document.getElementById('content');

    if (!Array.isArray(data) || data.length === 0) {
      container.innerHTML = '<div class="loading">No se encontraron comunidades</div>';
      return;
    }

    var html = '';
    data.forEach(function(comunidad) {
      html += '<div class="community-card">';
      html += '  <div class="community-header">';
      html += '    <div class="community-name">' + comunidad.nombre + '</div>';
      if (comunidad.codigo) html += '    <span class="community-code">' + comunidad.codigo + '</span>';
      html += '  </div>';
      html += '  <div class="modules-grid">';

      /* Dashboard siempre activo */
      html += '  <div class="module-item active">';
      html += '    <div class="module-info">';
      html += '      <div class="module-icon active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></div>';
      html += '      <div><div class="module-name">Dashboard</div><div class="module-always">Siempre activo</div></div>';
      html += '    </div>';
      html += '    <label class="toggle disabled"><input type="checkbox" checked disabled><span class="toggle-slider"></span></label>';
      html += '  </div>';

      /* Módulos configurables */
      Object.keys(MODULOS_META).forEach(function(key) {
        var meta = MODULOS_META[key];
        var modConfig = (Array.isArray(comunidad.modulos) ? comunidad.modulos : []).find(function(m) { return m.modulo === key; });
        var activo = modConfig ? modConfig.activo : false;

        html += '  <div class="module-item' + (activo ? ' active' : '') + '">';
        html += '    <div class="module-info">';
        html += '      <div class="module-icon ' + (activo ? 'active' : 'inactive') + '">' + meta.icono.replace('currentColor', activo ? '#22c55e' : '#94a3b8') + '</div>';
        html += '      <div class="module-name">' + meta.nombre + '</div>';
        html += '    </div>';
        html += '    <label class="toggle"><input type="checkbox" ' + (activo ? 'checked' : '') + ' data-comunidad="' + comunidad.id + '" data-modulo="' + key + '" onchange="toggleModulo(this)"><span class="toggle-slider"></span></label>';
        html += '  </div>';
      });

      html += '  </div>';
      html += '</div>';
    });

    container.innerHTML = html;
  }

  async function toggleModulo(checkbox) {
    var comunidadId = checkbox.getAttribute('data-comunidad');
    var modulo = checkbox.getAttribute('data-modulo');
    var activo = checkbox.checked;

    var item = checkbox.closest('.module-item');
    var icon = item.querySelector('.module-icon');
    var iconSvg = icon.querySelector('svg');

    if (activo) {
      item.classList.add('active');
      icon.classList.remove('inactive');
      icon.classList.add('active');
      if (iconSvg) iconSvg.setAttribute('stroke', '#22c55e');
    } else {
      item.classList.remove('active');
      icon.classList.remove('active');
      icon.classList.add('inactive');
      if (iconSvg) iconSvg.setAttribute('stroke', '#94a3b8');
    }

    try {
      await api('/comunidad/' + comunidadId, {
        method: 'PUT',
        body: JSON.stringify({ modulos: [{ modulo: modulo, activo: activo }] })
      });
      showToast(activo ? 'M\u00f3dulo activado' : 'M\u00f3dulo desactivado');
    } catch(e) {
      checkbox.checked = !activo;
      showToast('Error al guardar');
    }
  }

  /* ---- Particles ---- */
  (function(){
    var c = document.getElementById('particles');
    for (var i = 0; i < 20; i++) {
      var p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (6 + Math.random() * 10) + 's';
      p.style.animationDelay = Math.random() * 8 + 's';
      p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
      c.appendChild(p);
    }
  })();

  /* ---- Init ---- */
  cargar();
  </script>
</body>
</html>
