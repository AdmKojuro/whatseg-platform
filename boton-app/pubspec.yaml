name: whatseg_boton
description: "WhatsEg Botón de Pánico — Monitoreo de emergencias"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  geolocator: ^12.0.0
  shared_preferences: ^2.3.4
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/boton.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/boton.png"
  adaptive_icon_background: "#1a0000"

flutter:
  uses-material-design: true
  assets:
    - assets/boton.png
